<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather EE</title>
    <link rel="icon" href="ico.webp">
    <link rel="stylesheet" href="eelibs/import.css">
    <link rel="stylesheet" href="css/neoweather.css">
    <link rel="stylesheet" href="css/scroll.css">
    <link rel="stylesheet" href="css/backgrounds.css">
    <link rel="stylesheet" href="css/time.css">
    <link rel="stylesheet" href="css/module/header.css">
    <link rel="stylesheet" href="css/module/detalis.css">
    <link rel="stylesheet" href="css/adaptive/adaptive-import.css">

    <link rel="manifest" href="pwa.json">
    <meta name="theme-color" content="#121212">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</head>
<body style="display: flex;">
    <div id="nav" class="">
        <button id="openmenu" onclick="openNavPanel()"><img src="img/ui/lines.svg"></button>
        <div id="navcontent"></div>
    </div>
    <div id="content" class="">
        <div class="page" id="settings"></div>
        <div class="page" id="about"></div>
        <div class="page" id="socials"></div>
        <div class="page block" id="home">
            <div class="pageContainer">
                <div class="pageContent">

                    <!-- Важные времени - Погода и температура -->
                    <div id="important-times-weather" class="important-times-container">
                    </div>

                    <!-- Почасовой прогноз (48 часов) -->
                    <div class="div-hours cards" id="div-hours">
                        <div class="scroll-container" id="hours-container">
                        </div>
                    </div>

                    <!-- Подневной прогноз (на сегодня и ближайшие 10 дней) -->
                    <div class="div-detalis cards" id="div-days">
                        <div class="scroll-container" id="days-container">
                        </div>
                    </div>

                    <div id="sunday" class="detalis_card">
                        <div class="card_text">
                            <b>Световой день</b>
                            <div id="sunday_text">
                                <img src="img/arc.svg" class="nr sundayarc">
                                <div id="sunday2">
                                    <div>
                                        <img src="img/sunrise.webp">
                                        <div id="sunday_start"></div>
                                    </div>
                                    <p id="sunday_duration"></p>
                                    <div>
                                        <img src="img/sunset.webp">
                                        <div id="sunday_end"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="pressure" class="detalis_card">
                        <img src="pressure.webp">
                        <div class="card_text">
                            <b>Давление</b>
                            <p id="pressure_text"></p>
                        </div>
                    </div>
                    <div id="wind" class="detalis_card">
                        <img src="wind.webp" class="wind_ico">
                        <div class="card_text">
                            <b>Ветер</b>
                            <p id="wind_speed"></p>
                            <p id="wind_dirrection"></p>
                        </div>
                    </div>
                    <div id="clouds" class="detalis_card">
                        <img src="cloud.webp">
                        <div class="card_text">
                            <b>Облачность</b>
                            <p id="clouds_text"></p>
                        </div>
                    </div>
                    <div id="fallout" class="detalis_card">
                        <img src="fallout.webp" class="fallout_ico">
                        <div class="card_text">
                            <b>Осадки</b>
                            <p id="fallout_text"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="navdown" class=""></div>
    </div>

    <div id="modal" class="modal"><div id="modalForuse"></div></div>

</body>
<script src="eelibs/import.js" type="module"></script>
<script src="eelibs/js/bridge.js" type="module"></script>
<script src="eeframework.js" type="module"></script>

<!--script src="js/scroll.js"></script-->
<script src="js/script.js"></script>
<script src="js/now.js"></script>
</html>
